services:

  mysql:
    image: mysql:8.4
    container_name: ems-mysql

    environment:
      MYSQL_DATABASE: employee_management_system
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
     - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  backend:
    image: ems-backend:latest
    container_name: ems-backend

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SERVER_PORT: 8081

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/employee_management_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000

    ports:
      - "8082:8081"


  frontend:
    image: ems-frontend:latest
    container_name: ems-frontend

    depends_on:
      - backend

    ports:
      - "5173:80"


volumes:
  mysql_data: